<title>Фронт: Застава</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap">
<style>
/* Layout: one-screen app in three stacked bands that never overlap — status bar, battlefield canvas, command panel.
   Look: the same daylight toy battlefield as «Фронт» — green field, navy panel, chunky buttons. */
:root{
  color-scheme:dark;
  --bg:#1b2a41; --surface:#213655; --card:#2b4770; --fg:#ffffff; --muted:#b5c6de;
  --gold:#ffc93c; --steel:#9fd0ff; --btn:#4d74ad; --buy:#3fae5a; --atk:#e0563f; --sel:#f0a02a; --hp:#7be07a; --tech:#5a6f8c;
  --font:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);font-weight:700;overflow:hidden;touch-action:none}
#app{display:flex;flex-direction:column;height:100%;max-width:900px;margin:0 auto}
#top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:9px;padding-block:5px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--surface);border-bottom:2px solid rgba(0,0,0,.25);font-size:13px;font-variant-numeric:tabular-nums}
.res{display:grid;gap:1px;line-height:1.15}
.res b{color:var(--gold);font-weight:800;font-size:14px}
.res b.s{color:var(--steel);font-size:12.5px}
.coin{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25);margin-right:5px;vertical-align:-1px}
.coin.s{border-radius:2px;background:var(--steel)}
.mid{display:grid;gap:2px;min-width:0}
.mid .l{display:flex;justify-content:space-between;gap:6px;font-size:10.5px;color:var(--muted);white-space:nowrap}
.mid .l span:first-child{color:var(--fg)}
.mid .l span{overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:3px}
#wv{background:var(--sel)}#hp{background:var(--hp)}#ehp{background:var(--atk)}
.tb{display:flex;gap:4px}
.tb button{width:35px;padding:5px 0 7px;font-size:10.5px}
#wrap{flex:1;position:relative;min-height:0;overflow:hidden}
canvas{display:block;touch-action:none;position:absolute;inset:0}
#panel{background:var(--surface);display:grid;gap:5px;padding-block:6px;border-top:2px solid rgba(255,255,255,.12);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.row.r5{grid-template-columns:repeat(5,1fr)}
button{font:inherit;font-weight:800;color:var(--fg);background:var(--btn);border:0;border-radius:9px;padding:6px 3px 8px;font-size:12px;width:100%;cursor:pointer;min-width:0;
  font-variant-numeric:tabular-nums;box-shadow:inset 0 -3px 0 rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.22);text-shadow:0 1px 0 rgba(0,0,0,.3)}
button:active:not(:disabled){transform:translateY(1px);box-shadow:inset 0 -1px 0 rgba(0,0,0,.28)}
button:disabled{opacity:.45;cursor:default}
button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.on{background:var(--sel)}
.k{padding:4px 2px 6px;display:grid;gap:0;line-height:1.2}
.k span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.k .n{font-size:11px}
.k .d{font-size:9px;font-weight:600;color:var(--muted)}
.k .c{font-size:11.5px;color:var(--gold)}
.k .c.s{color:var(--steel)}
.card{background:var(--card)}
.tech{background:var(--tech)}
#bAir{background:var(--atk)}#bSup{background:var(--buy)}
@media (max-width:370px){.k .n{font-size:9.5px}.k .d{font-size:8px}.k .c{font-size:10.5px}#panel{gap:4px}.row{gap:4px}}
#ov{position:absolute;inset:0;z-index:5;overflow:auto;display:flex;align-items:center;justify-content:center;padding:14px;
  background:radial-gradient(120% 90% at 50% 0%,rgba(58,96,150,.96),rgba(18,30,52,.97) 70%)}
.sheet{width:100%;max-width:400px;display:grid;gap:10px;justify-items:center;text-align:center}
.crest{width:74px;height:74px}
#ovh{font-size:30px;font-weight:800;line-height:1.05;color:var(--gold);text-shadow:0 3px 0 rgba(0,0,0,.35);text-wrap:balance}
.sub{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.tips{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;text-align:left}
.tips li{background:rgba(255,255,255,.07);border-radius:10px;padding:7px 9px;font-size:11px;font-weight:600;color:var(--muted);line-height:1.3;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.tips b{display:block;color:var(--fg);font-weight:800;font-size:11.5px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;width:100%}
.stats div{background:rgba(255,255,255,.08);border-radius:10px;padding:8px 2px;font-size:10px;font-weight:700;color:var(--muted);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.stats b{display:block;font-size:17px;color:var(--fg);font-weight:800;font-variant-numeric:tabular-nums}
.note{font-size:12px;font-weight:600;color:var(--muted);line-height:1.4;max-width:340px}
.lbl{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.d{display:flex;gap:8px;width:100%;max-width:320px}
.d button{padding:10px 4px 12px;font-size:14px}
.d .go{background:var(--buy)}.d .hard{background:var(--atk)}
@media (max-height:620px){.crest{width:48px;height:48px}#ovh{font-size:24px}.tips li{padding:5px 7px}}
</style>

<div id="app">
  <div id="top">
    <div class="res"><span><i class="coin"></i><b id="gold">0</b></span><span><i class="coin s"></i><b id="steel" class="s">0</b></span></div>
    <div class="mid">
      <div class="l"><span id="wvt">Подготовка</span><span id="hpt"></span></div>
      <div class="bar"><i id="wv"></i></div>
      <div class="bar"><i id="hp"></i></div>
      <div class="bar"><i id="ehp"></i></div>
    </div>
    <span class="tb"><button id="bSpd" aria-label="Скорость">×1</button><button id="bSnd" aria-label="Звук">Звук</button><button id="bHelp" aria-label="Пауза и правила">?</button></span>
  </div>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="ov"><div class="sheet">
      <svg class="crest" viewBox="0 0 64 64" aria-hidden="true"><path d="M32 3 56 12v20c0 14-10 23-24 29C18 55 8 46 8 32V12z" fill="#235f9f" stroke="#ffc93c" stroke-width="3" stroke-linejoin="round"/><path d="M32 9 50 16v16c0 10-7 18-18 23z" fill="#3f8fe0"/><path d="m32 18 4.1 8.6 9.4 1.2-6.9 6.5 1.8 9.3L32 39.1l-8.4 4.5 1.8-9.3-6.9-6.5 9.4-1.2z" fill="#ffc93c" stroke="#1c2a3a" stroke-width="1.5" stroke-linejoin="round"/></svg>
      <h1 id="ovh">Фронт: Застава</h1>
      <div class="sub" id="ovs">14 волн · мост · цитадель на том берегу</div>
      <div id="ovb" style="display:contents"></div>
      <div class="lbl" id="ovl">Сложность</div>
      <div class="d">
        <button data-d="1" class="go">Норм</button>
        <button data-d="1.12" class="hard">Жёстко</button>
      </div>
      <div class="d" id="ovr" hidden><button id="bRes" class="on">Продолжить бой</button></div>
    </div></div>
  </div>
  <div id="panel">
    <div class="row r5" id="cards"></div>
    <div class="row r5">
      <button id="bAsl" class="k"><span class="n">Приказ</span><span class="c" id="aslT">оборона</span></button>
      <button id="bGate" class="k"><span class="n">Ворота</span><span class="c" id="gateT">открыты</span></button>
      <button id="bClone" class="k"><span class="n">×2 Клоны</span><span class="c" id="cloneT"></span></button>
      <button id="bAir" class="k"><span class="n">Авиаудар</span><span class="c" id="airT"></span></button>
      <button id="bSup" class="k"><span class="n">Подмога</span><span class="c" id="supT"></span></button>
    </div>
    <div class="row">
      <button id="bSpec" class="k tech"><span class="n">Взвод</span><span class="c s" id="specT"></span></button>
      <button id="bWpn" class="k tech"><span class="n">Ствол</span><span class="c s" id="wpnT"></span></button>
      <button id="bMine" class="k tech"><span class="n">Мины</span><span class="c s" id="mineT"></span></button>
      <button id="bMod" class="k tech"><span class="n">Танкам</span><span class="c s" id="modT"></span></button>
    </div>
  </div>
</div>
<script>
(()=>{
// ---------- world: fixed 400×640 field scaled to the canvas, so balance does not depend on screen size ----------
const W=400,H=740,EW=64,RIV=300,RH=16,BW=110,WALL=540,GX=200,GW=90;
const TENT={x:60,y:676},ARM={x:154,y:656},MED={x:246,y:686},FAC={x:340,y:676},CMD={x:138,y:WALL-8},DOT={x:GX+84,y:RIV+46};
const WAVES=14,WDUR=50,REST=5,LIM=400,EHP=60000;
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d'),wrap=$('wrap');
const dpr=Math.min(2.5,Math.max(1,window.devicePixelRatio||1));
let cw=300,ch=300,vs=1,ox=0,oy=0;
function resize(){cw=Math.max(50,wrap.clientWidth);ch=Math.max(50,wrap.clientHeight);cv.style.width=cw+'px';cv.style.height=ch+'px';
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);vs=Math.min(cw/W,ch/H);ox=(cw-W*vs)/2;oy=(ch-H*vs)/2}
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a);
const turn=(a,b,k)=>a+(((b-a+9.4248)%6.2832)-3.1416)*Math.min(1,k);

// ---------- sound: tiny synth, starts on the first tap ----------
let ac=null,muted=false,diff=1,running=false,paused=false,speed=1;
try{const p=JSON.parse(localStorage.getItem('zastava')||'{}');muted=!!p.muted}catch(_){}
function audio(){if(!ac){const A=window.AudioContext||window.webkitAudioContext;if(A)try{ac=new A()}catch(_){}}if(ac&&ac.state=='suspended')ac.resume()}
const SND={shoot:['sawtooth',260,70,.06,.035],cannon:['triangle',120,28,.22,.12],coin:['sine',900,1400,.1,.045],up:['triangle',440,700,.25,.1],clone:['sine',520,940,.1,.07],air:['sawtooth',180,35,.45,.18],lose:['sawtooth',200,50,.6,.15],hot:['square',300,120,.2,.05]};
let sndT=0;
function snd(k){if(muted||!ac)return;const now=ac.currentTime;if(k=='shoot'){if(now-sndT<.07)return;sndT=now}
  try{const[type,f0,f1,d,v]=SND[k],o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.type=type;
    o.frequency.setValueAtTime(f0,now);o.frequency.exponentialRampToValueAtTime(f1,now+d);g.gain.setValueAtTime(v,now);g.gain.linearRampToValueAtTime(.001,now+d);o.start(now);o.stop(now+d)}catch(_){}}

// ---------- rules ----------
const recInt=l=>Math.max(.6,2-.2*(l-1));
const UPG={
  bar:{name:'Казарма',max:7,cost:l=>Math.round(90*1.5**(l-1)),desc:l=>`боец/${recInt(l).toFixed(1)} с`},
  arm:{name:'Оружие',max:5,cost:l=>Math.round(130*1.6**(l-1)),desc:l=>'урон и броня'},
  tank:{name:'Танки',max:3,cost:l=>l==0?250:Math.round(320*1.7**l),desc:l=>l==0?'построить':['лёгкий','средний','тяжёлый'][l-1]},
  tur:{name:'Турели',max:6,cost:l=>l==0?110:Math.round(150*1.5**l),desc:l=>l==0?'построить':`${Math.min(4,l)} шт., стена+`},
  med:{name:'Медчасть',max:4,cost:l=>Math.round(140*1.6**l),desc:l=>l==0?'построить':'лечит и чинит'},
};
const UK=['bar','arm','tank','tur','med'];
const AB={clone:{cost:120,cd:30},air:{cost:180,cd:28},sup:{cost:70,cd:12}};
const SPEC={rifle:'стрелки',rpg:'гранатомёты',snipe:'снайперы'},SPK=['rifle','rpg','snipe'];
const WPN={mg:{name:'пулемёт',steel:0,cd:.16,heat:4},rifle:{name:'винтовка',steel:40,cd:.8,heat:15},mortar:{name:'миномёт',steel:60,cd:1.3,heat:22}},WK=['mg','rifle','mortar'];
const MODS=[['armor','броня',45],['mg','пулемёт',45]],MINE_COST=15,MINE_CD=18;
let G;
function newGame(){
  G={gold:150,steel:20,wave:0,wt:0,gt:0,grp:0,rest:REST,done:false,over:false,win:false,time:0,kills:0,gateOpen:true,hp:1200,max:1200,ehp:EHP*diff,emax:EHP*diff,citCd:0,
    lv:{bar:1,arm:1,tank:0,tur:0,med:0},cd:{clone:0,air:0,sup:0,mine:0},recT:0,tankT:0,cmdCd:0,cmdA:-1.57,heat:0,hot:0,spec:'rifle',wpn:'mg',own:{mg:1},mod:{},aim:false,assault:false,
    rec:[],green:[],red:[],bul:[],fxp:[],coins:[],txt:[],gates:[],toasts:[],mines:[],blast:[],decals:[],dot:{owner:'n',prog:0,cd:0,a:-1.57},shake:0,
    tur:[0,1,2,3].map(i=>({cd:i*.15,a:-1.57})),ptr:{x:0,y:0,on:false},uid:0};
  for(let i=0;i<3;i++)G.green.push(soldier(GX+rnd(-30,30),WALL-24-i*14,1,'rifle'));
  for(const dx of[-64,64])G.red.push(enemy('bunker',GX+dx,EW+16,1));
  toast('Готовься: первая волна через '+REST+' с');
}
function soldier(x,y,a,kind){const b={id:G.uid++,tank:false,kind,tier:a,x,y,speed:42,r:8,cd:Math.random()*.2,a:-1.57,ta:-1.57,cl:{}};
  if(kind=='rpg')Object.assign(b,{hp:42+16*a,dmg:16+7*a,range:108,rate:1.5,arm:2.5,soft:.5,shell:true});
  else if(kind=='snipe')Object.assign(b,{hp:34+12*a,dmg:22+9*a,range:185,rate:1.6});
  else Object.assign(b,{hp:45+18*a,dmg:7+3*a,range:116+6*a,rate:Math.max(.3,.6-.05*a)});
  b.max=b.hp;return b}
function tank(x,y,t){const hp=300+200*t;return{id:G.uid++,tank:true,heavy:t>=3,kind:'tank',x,y,hp,max:hp,dmg:40+30*t,range:150+10*t,rate:1.2,cd:.2,mgCd:0,speed:28,r:t>=3?21:17,tier:t,arm:1.2,shell:true,a:-1.57,ta:-1.57,cl:{}}}
const SCALE=1.148;
function enemy(type,x,y,w){const s=SCALE**(w-1)*diff;let e;
  if(type=='tank')e={hp:300*s,dmg:26*s,range:140,rate:1.4,speed:22,r:15,reward:16,arm:1.2,shell:true};
  else if(type=='boss')e={hp:1400*s*(w>=WAVES?1.3:1),dmg:50*s,range:160,rate:1,speed:16,r:23,reward:80,arm:1.2,shell:true};
  else if(type=='bunker')e={hp:2600*diff,dmg:22*diff,range:135,rate:.7,speed:0,r:13,reward:30,fixed:true};
  else if(type=='truck')e={hp:260*s,dmg:0,range:0,rate:9,speed:26,r:15,reward:60};
  else if(type=='rpg')e={hp:46*s,dmg:15*s,range:100,rate:1.4,speed:30,r:7,reward:4,arm:2.3,soft:.7,shell:true};
  else if(type=='snipe')e={hp:34*s,dmg:18*s,range:165,rate:1.6,speed:28,r:7,reward:5};
  else e={hp:40*s,dmg:6*s,range:105,rate:.7,speed:34+Math.random()*5,r:7,reward:3};
  return Object.assign(e,{id:G.uid++,type,x,y,max:e.hp,cd:Math.random()*.5,a:1.57,ta:1.57})}
const armored=o=>o.tank||o.type=='tank'||o.type=='boss'||o.type=='bunker'||o.type=='truck';
function toast(msg){G.toasts.push({msg,life:3.2});if(G.toasts.length>2)G.toasts.shift()}
function ftext(t,x,y,c,s){G.txt.push({t,x,y,a:1,c:c||'#ffc93c',s:s||12})}
function boom(x,y,r,c){for(let i=0;i<12;i++){const a=Math.random()*6.283,v=20+Math.random()*r*2.6;G.fxp.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,r:2+Math.random()*4,life:.3+Math.random()*.25,max:.55,c:i%2?c:'#ffe08a'})}
  if(r>10)for(let i=0;i<3;i++)G.fxp.push({x:x+rnd(-r,r)*.3,y:y+rnd(-r,r)*.3,vx:rnd(-6,6),vy:-rnd(10,22),r:r*.25+2,g:r*.5,life:1,max:1,c:'#5b6068',sm:1});if(G.fxp.length>500)G.fxp.splice(0,G.fxp.length-500)}
function decal(x,y,r,wreck){G.decals.push({x,y,r,wreck});if(G.decals.length>70)G.decals.shift()}
function fire(s,t,team){const dx=t.x-s.x,dy=t.y-s.y,d=Math.hypot(dx,dy)||1,v=s.shell?300:440;
  s.ta=Math.atan2(dy,dx);if(!armored(s))s.a=s.ta;
  G.bul.push({x:s.x+dx/d*s.r,y:s.y+dy/d*s.r,vx:dx/d*v,vy:dy/d*v,dmg:s.dmg,team,shell:!!s.shell,arm:s.arm,soft:s.soft,life:.9});
  G.fxp.push({x:s.x+dx/d*(s.r+3),y:s.y+dy/d*(s.r+3),vx:0,vy:0,r:s.shell?5:2.6,life:.07,max:.07,c:'#fff3c4'});snd(s.shell?'cannon':'shoot')}
function hurt(o,dmg,b){let m=1;if(b)m=armored(o)?(b.arm||1):(b.soft||1);if(o.tank&&G.mod.armor)m*=.7;o.hp-=dmg*m}
function kill(i){const e=G.red[i],big=armored(e);boom(e.x,e.y,big?28:12,'#e2564a');decal(e.x,e.y,big?e.r:5,big);
  G.coins.push({x:e.x,y:e.y,v:e.reward*(G.dot.owner=='g'?1.3:1),age:0});G.kills++;
  if(e.type=='truck'){G.steel+=35;ftext('+35 стали',e.x,e.y-16,'#9fd0ff',13);toast('Конвой перехвачен: +35 стали')}
  if(e.type=='bunker'){G.steel+=10;ftext('+10 стали',e.x,e.y-16,'#9fd0ff',12)}
  if(e.type=='boss')G.shake=.45;G.red.splice(i,1)}
function blast(x,y,r,dmg,c){boom(x,y,r*.8,c||'#f0a02a');decal(x,y,r*.45);G.shake=Math.max(G.shake,r>50?.35:.12);snd('cannon');
  for(let i=G.red.length-1;i>=0;i--){const e=G.red[i];if(Math.hypot(e.x-x,e.y-y)<r+e.r){e.hp-=dmg*(e.type=='boss'?.7:1);if(e.hp<=0)kill(i)}}}

function up(k){const u=UPG[k],l=G.lv[k],c=u.cost(l);if(G.over||l>=u.max||G.gold<c)return false;G.gold-=c;G.lv[k]++;snd('up');
  const p={bar:TENT,arm:ARM,tank:FAC,med:MED,tur:{x:GX,y:WALL+16}}[k];
  if(k=='tank')G.green.push(tank(FAC.x,FAC.y-22,G.lv.tank));
  if(k=='tur'){G.max+=250;G.hp=Math.min(G.max,G.hp+350)}
  ftext(u.name+' '+G.lv[k],p.x,p.y-40,'#ffc93c',13);hud();return true}
function ability(k,x,y){const a=AB[k];if(G.over||G.cd[k]>0||G.gold<a.cost)return false;
  if(k=='air'&&x==null){G.aim=!G.aim;if(G.aim)toast('Ткни в цель на поле');hud();return true}
  G.gold-=a.cost;G.cd[k]=a.cd;
  if(k=='clone'){G.gates.push({id:G.uid++,x:GX,y:WALL-50,w:130,life:12});snd('clone');toast('Ворота ×2 на 12 с')}
  else if(k=='air'){G.aim=false;snd('air');G.blast.push({x,y,t:.6,r:75,dmg:260+40*G.lv.arm,air:true})}
  else{for(let i=0;i<5;i++)G.rec.push({x:TENT.x+(i-2)*10,y:TENT.y+6,speed:110});snd('up');toast('Подмога: +5')}
  hud();return true}
function toggleGate(){if(G.over)return;G.gateOpen=!G.gateOpen;snd('up');toast(G.gateOpen?'Ворота открыты — вперёд':'Ворота закрыты — копим силы');hud()}

function nextWpn(k){if(G.over)return false;const i=WK.indexOf(G.wpn);k=k||WK[(i+1)%3];
  if(!G.own[k]){if(G.steel<WPN[k].steel){k=WK.find((w,j)=>j>WK.indexOf(k)&&G.own[w])||'mg';if(k==G.wpn)return false}else{G.steel-=WPN[k].steel;G.own[k]=1;snd('up');toast('Командиру выдан '+WPN[k].name)}}

function layMines(){if(G.over||G.cd.mine>0||G.steel<MINE_COST)return false;G.steel-=MINE_COST;G.cd.mine=MINE_CD;
  for(let i=0;i<5;i++)G.mines.push({x:GX-BW/2+14+i*(BW-28)/4,y:RIV-RH-16+((i%2)*10)});snd('up');toast('Мины у моста заложены');hud();return true}

// ---------- simulation ----------
function nearest(list,x,y,skip){let b=null,bd=1e9;for(const o of list){if(skip&&skip(o))continue;const d=Math.hypot(o.x-x,o.y-y);if(d<bd){bd=d;b=o}}return[b,bd]}
// the river is crossed only over the bridge
function steer(u,tx,ty){const lo=GX-BW/2+u.r+2,hi=GX+BW/2-u.r-2,inB=Math.abs(u.y-RIV)<RH+3;
  if(inB||(u.y-RIV)*(ty-RIV)<0){if(u.x<lo||u.x>hi)return inB?[clamp(u.x,lo,hi),u.y]:[clamp(u.x,lo+4,hi-4),RIV+(u.y>RIV?1:-1)*(RH+12)];return[clamp(tx,lo,hi),ty]}
  return[tx,ty]}
function move(u,tx,ty,dt,k){[tx,ty]=steer(u,tx,ty);const dx=tx-u.x,dy=ty-u.y,d=Math.hypot(dx,dy);if(d<2)return;
  u.x+=dx/d*u.speed*(k||1)*dt;u.y+=dy/d*u.speed*(k||1)*dt;u.a=turn(u.a,Math.atan2(dy,dx),dt*8)}
function step(dt){if(G.over)return;G.time+=dt;
  for(const k in G.cd)G.cd[k]=Math.max(0,G.cd[k]-dt);
  // waves
  if(G.rest>0){G.rest-=dt;if(G.rest<=0){G.wave++;G.wt=0;G.gt=0;G.grp=0;const w=G.wave;toast(w==WAVES?'Последняя волна!':'Волна '+w+(w==10?' — сумерки':''));
      if(w>1){G.steel+=12;G.gold+=20+5*w}
      if(w%5==0||w==WAVES){G.red.push(enemy('boss',GX,EW+20,w));toast(w==WAVES?'Последняя волна: идёт главный босс!':'Волна '+w+': танк-босс!')}
      if(w%3==0){G.red.push(enemy('truck',-18,EW+44,w));toast('Конвой снабжения на том берегу — сбей его!')}}}
  else if(!G.done){G.wt+=dt;G.gt+=dt;const w=G.wave,gi=Math.max(.9,2.7-.14*w);
    if(G.gt>=gi&&G.red.length<LIM){G.gt=0;G.grp++;const n=2+(Math.random()*3|0)+(w/4|0),cx=GX+rnd(-70,70);
      for(let k=0;k<n;k++){const r=Math.random(),t=w>=2&&r<.17?'rpg':w>=3&&r<.3?'snipe':'rifle';G.red.push(enemy(t,clamp(cx+(k-n/2)*18,GX-110,GX+110),EW+rnd(14,30),w))}
      if(w>=2&&G.grp%Math.max(3,7-(w/3|0))==0)G.red.push(enemy('tank',GX+rnd(-60,60),EW+18,w))}

  // conveyor: recruit -> armory -> soldier of the chosen kind
  G.recT+=dt;if(G.recT>=recInt(G.lv.bar)&&G.rec.length<20&&G.green.length<LIM){G.recT=0;G.rec.push({x:TENT.x+rnd(-8,8),y:TENT.y+6,speed:80+G.lv.bar*5})}
  for(let i=G.rec.length-1;i>=0;i--){const r=G.rec[i],dx=ARM.x-r.x,dy=ARM.y+14-r.y,d=Math.hypot(dx,dy);
    if(d<10){G.rec.splice(i,1);G.green.push(soldier(ARM.x+rnd(-12,12),ARM.y-8,G.lv.arm,G.spec))}else{r.x+=dx/d*r.speed*dt;r.y+=dy/d*r.speed*dt}}
  if(G.lv.tank>0){G.tankT+=dt;if(G.tankT>=tankInt()&&G.green.length<LIM){G.tankT=0;G.green.push(tank(FAC.x,FAC.y-22,G.lv.tank));snd('up')}}
  for(let i=G.gates.length-1;i>=0;i--)if((G.gates[i].life-=dt)<=0)G.gates.splice(i,1);

    if(u.tank&&G.mod.mg){u.mgCd-=dt;if(u.mgCd<=0){const[m,md]=nearest(G.red,u.x,u.y,armored);if(m&&md<115){u.mgCd=.4;const dx=m.x-u.x,dy=m.y-u.y;
      G.bul.push({x:u.x,y:u.y,vx:dx/md*440,vy:dy/md*440,dmg:6+2*u.tier,team:'g',shell:false,life:.4})}}}
    if(u.y>WALL-6){const tx=GX+(u.tank?16:-10)+((u.id%7)-3)*5,ty=G.gateOpen?WALL-22:WALL+24+(u.id%4)*11;move(u,tx,ty,dt,1.3);

      for(const g of G.gates)if(!u.cl[g.id]&&Math.abs(u.y-g.y)<12&&Math.abs(u.x-g.x)<g.w/2){u.cl[g.id]=1;
        if(G.green.length<LIM){const c=u.tank?tank(u.x+22,u.y-4,u.tier):soldier(u.x+rnd(-14,14),u.y-8,u.tier,u.kind);c.cl[g.id]=1;G.green.push(c);snd('clone');ftext('×2',u.x,u.y-14,'#9fd0ff',13)}}
      if(ne&&nd<=u.range){if(u.cd<=0){fire(u,ne,'g');u.cd=u.rate}}

  for(let i=0;i<nt;i++){const t=G.tur[i],p=turPos(i);t.cd-=dt;if(t.cd>0)continue;const[e,d]=nearest(G.red,p.x,p.y);

      G.bul.push({x:p.x,y:p.y,vx:(e.x-p.x)/d*420,vy:(e.y-p.y)/d*420,dmg:12+5*G.lv.tur,team:'g',shell:false,life:.55});snd('shoot')}}
  {const D=G.dot;let g=0,r=0;for(const u of G.green)if(!u.tank&&Math.hypot(u.x-DOT.x,u.y-DOT.y)<44)g++;for(const e of G.red)if(!armored(e)&&Math.hypot(e.x-DOT.x,e.y-DOT.y)<44)r++;
    if(g&&!r)D.prog=Math.min(5,D.prog+dt);else if(r&&!g)D.prog=Math.max(-5,D.prog-dt);
    const was=D.owner;if(D.prog>=5)D.owner='g';else if(D.prog<=-5)D.owner='r';else if((D.owner=='g'&&D.prog<0)||(D.owner=='r'&&D.prog>0))D.owner='n';
    if(D.owner!=was){if(D.owner=='g')toast('ДОТ у моста наш: +30% золота');else if(was=='g')toast('ДОТ у моста потерян')}
    D.cd-=dt;if(D.owner!='n'&&D.cd<=0){const[e,d]=nearest(D.owner=='g'?G.red:G.green,DOT.x,DOT.y);
      if(e&&d<125){D.cd=.5;D.a=Math.atan2(e.y-DOT.y,e.x-DOT.x);G.bul.push({x:DOT.x,y:DOT.y,vx:(e.x-DOT.x)/d*420,vy:(e.y-DOT.y)/d*420,dmg:14*(D.owner=='r'?diff:1),team:D.owner,shell:false,life:.4});snd('shoot')}}}
  // commander: finger-aimed with barrel heat; idle auto-fire is slower and never crits
  G.cmdCd-=dt;const wp=WPN[G.wpn],firing=G.ptr.on&&!G.aim&&G.hot<=0;
  if(G.hot>0){G.hot-=dt;G.heat=Math.max(0,G.heat-45*dt)}else if(!firing)G.heat=Math.max(0,G.heat-26*dt);
  if(G.cmdCd<=0&&G.hot<=0){let tx,ty,ok=false,man=false;
    if(firing){tx=G.ptr.x;ty=Math.min(G.ptr.y,CMD.y-4);ok=man=true;G.cmdCd=wp.cd}
    else if(!G.ptr.on){const[e,d]=nearest(G.red,CMD.x,CMD.y);if(e&&d<230){tx=e.x;ty=e.y;ok=true;G.cmdCd=wp.cd*2}}
    if(ok){const dx=tx-CMD.x,dy=ty-CMD.y,d=Math.hypot(dx,dy)||1,a=G.lv.arm,crit=man&&G.heat>=60&&G.heat<=88?2:1;G.cmdA=Math.atan2(dy,dx);
      if(man){G.heat+=wp.heat;if(G.heat>=100){G.heat=100;G.hot=1.6;snd('hot');ftext('Перегрев!',CMD.x,CMD.y-26,'#e2564a',12)}}
      if(G.wpn=='mortar')G.blast.push({x:tx,y:ty,t:Math.min(.7,d/420),r:36,dmg:(45+15*a)*crit,sx:CMD.x,sy:CMD.y,t0:Math.min(.7,d/420)});
      else G.bul.push({x:CMD.x,y:CMD.y,vx:dx/d*(G.wpn=='rifle'?700:520),vy:dy/d*(G.wpn=='rifle'?700:520),dmg:(G.wpn=='rifle'?70+25*a:9+3*a)*crit,team:'g',shell:false,life:.9,pierce:G.wpn=='rifle'?3:0,crit:crit>1,hit:{}});
      G.fxp.push({x:CMD.x+dx/d*13,y:CMD.y+dy/d*13,vx:0,vy:0,r:crit>1?5:3.4,life:.07,max:.07,c:crit>1?'#ffc93c':'#fff3c4'});snd(G.wpn=='mg'?'shoot':'cannon')}}
  for(let i=G.blast.length-1;i>=0;i--){const b=G.blast[i];if((b.t-=dt)<=0){G.blast.splice(i,1);
    if(b.air){for(let k=0;k<5;k++)blast(b.x+rnd(-38,38),b.y+rnd(-38,38),38,0);blast(b.x,b.y,b.r,b.dmg)}else blast(b.x,b.y,b.r,b.dmg)}}
  G.citCd-=dt;if(G.citCd<=0){const[t,d]=nearest(G.green,GX,EW);if(t&&d<170){G.citCd=.8;const s=SCALE**(Math.max(1,G.wave)-1)*diff;
    G.bul.push({x:GX,y:EW-6,vx:(t.x-GX)/d*300,vy:(t.y-EW+6)/d*300,dmg:30*s,team:'r',shell:true,arm:1.3,life:.8,spl:28});snd('cannon')}}
  // enemies
  for(let i=0;i<G.red.length;i++){const e=G.red[i];e.cd=Math.max(0,e.cd-dt);
    if(e.type=='truck'){e.x+=e.speed*dt;e.a=0;if(e.x>W+20){G.red.splice(i--,1);toast('Конвой ушёл')}continue}
    for(let m=G.mines.length-1;m>=0;m--){const mn=G.mines[m];if(Math.hypot(mn.x-e.x,mn.y-e.y)<e.r+6){G.mines.splice(m,1);boom(mn.x,mn.y,26,'#f0a02a');decal(mn.x,mn.y,9);snd('cannon');
      for(const o of G.red)if(Math.hypot(o.x-mn.x,o.y-mn.y)<30+o.r)o.hp-=armored(o)?260:70}}
    const[t,d]=nearest(G.green,e.x,e.y,g=>!G.gateOpen&&g.y>WALL+14);

    else if(e.fixed)continue;
    else if(e.y<WALL-14-e.r*.5){move(e,GX+Math.sin(e.y*.03+e.id)*30,WALL-10,dt);e.ta=turn(e.ta,e.a,dt*4)}
    else if(e.cd<=0){e.cd=e.rate;G.hp=Math.max(0,G.hp-e.dmg);boom(e.x,WALL-6,8,'#e2564a');if(G.hp<=0){end(false);return}}}
  for(let i=G.red.length-1;i>=0;i--)if(G.red[i].hp<=0)kill(i);

    for(let j=list.length-1;j>=0;j--){const o=list[j];if(b.hit&&b.hit[o.id])continue;
      if(Math.hypot(o.x-b.x,o.y-b.y)<o.r+(b.shell?8:4)){hurt(o,b.dmg,b);if(b.shell)boom(b.x,b.y,16,'#f0a02a');if(b.spl)for(const q of list)if(q!==o&&Math.hypot(q.x-b.x,q.y-b.y)<b.spl+q.r)hurt(q,b.dmg*.6,b);if(b.crit)ftext('крит',o.x,o.y-12,'#ffc93c',10);
        let gone=true;if(b.pierce>0){b.pierce--;b.hit[o.id]=1;gone=false}else G.bul.splice(i,1);
        if(o.hp<=0){if(b.team=='g')kill(list.indexOf(o));else{boom(o.x,o.y,o.tank?22:9,'#3f8fe0');decal(o.x,o.y,o.tank?o.r:5,o.tank);list.splice(j,1)}}
        if(gone)break}}}
  // coins fly to the purse by themselves

  for(let i=G.fxp.length-1;i>=0;i--){const p=G.fxp[i];p.x+=p.vx*dt;p.y+=p.vy*dt;if((p.life-=dt)<=0)G.fxp.splice(i,1)}
  for(let i=G.txt.length-1;i>=0;i--){const t=G.txt[i];t.y-=34*dt;if((t.a-=dt*.9)<=0)G.txt.splice(i,1)}
  G.toasts=G.toasts.filter(t=>(t.life-=dt)>0);G.shake=Math.max(0,G.shake-dt);
  sep(G.green,dt);sep(G.red,dt);
}
const tankInt=()=>Math.max(5,11-1.5*G.lv.tank);

  if(Math.abs(dx)>m||Math.abs(dy)>m)continue;const d=Math.hypot(dx,dy);if(d>.1&&d<m){const p=(m-d)*3*dt,nx=dx/d,ny=dy/d;if(!a.fixed){a.x-=nx*p;a.y-=ny*p}if(!b.fixed){b.x+=nx*p;b.y+=ny*p}}}
  for(const u of list){if(u.type=='truck')continue;u.x=clamp(u.x,10,W-10);if(Math.abs(u.y-RIV)<RH)u.x=clamp(u.x,GX-BW/2+u.r,GX+BW/2-u.r)}}
